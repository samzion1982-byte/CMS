<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Church CMS">
  <defs>
    <linearGradient id="cmsBg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#cmsBg)"/>
  <!-- Latin cross — church -->
  <rect x="14" y="4.5" width="4" height="15.5" rx="1.2" fill="#f4d06f"/>
  <rect x="8.5" y="8.5" width="15" height="4" rx="1.2" fill="#f4d06f"/>
  <!-- Register lines — membership / management -->
  <rect x="8" y="22.2" width="16" height="2.1" rx="1.05" fill="#e8eef5"/>
  <rect x="8" y="25.6" width="11" height="2.1" rx="1.05" fill="#c5d4c8"/>
</svg>
