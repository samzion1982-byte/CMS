# Fly.io — Print Corner Gotenberg (LibreOffice PDF + Tamil fonts)
# Deploy: fly deploy (from this directory, after fly launch)
# Region bom = Mumbai (low latency for India)

app = 'print-corner-gotenberg'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
